<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>
</head>

<body>
    <button class="togglebtn" onclick="togglebtn()">toggle</button>
    <div class="calc-body">
        <div class="calc-mirror">
            <div class="mirror-child"><input type="text" id="screen1"></div>
            <div class="mirror-child" ><input type="text" id="screen2"></div>
        </div>
        <div class="calc-child">
            <button class="child" onclick="operators('√')">√X</button>
            <button class="child" onclick="operators('∛')">∛X</button>
            <button class="child" onclick="operators('²')">X²</button>
            <!-- <button class="child" onclick="operators()"></button> -->
            <button class="child" onclick="operators('³')">X³</button>
            <button class="child" onclick="screenClear()">AC</button>
        </div>
        <div class="calc-child">
            <button class="child" onclick="numdisplay(7)">
                <p>7</p>
            </button>
            <button class="child" onclick="numdisplay(8)">8</button>
            <button class="child" onclick="numdisplay(9)">9</button>
            <button class="child" onclick="clearscreen()">CE</button>
            <button class="child" onclick="clearbtn()">DEL</button>
        </div>
        <div class="calc-child">
            <button class="child" onclick="numdisplay(4)">4</button>
            <button class="child" onclick="numdisplay(5)">5</button>
            <button class="child" onclick="numdisplay(6)">6</button>
            <button class="child" onclick="operators('-')">-</button>
            <button class="child" onclick="operators('⊹')">⊹</button>
            <!-- <button class="child" onclick="operators(-)"></button> -->
        </div>
        <div class="calc-child">
            <button class="child" onclick="numdisplay(1)">1</button>
            <button class="child" onclick="numdisplay(1)">2</button>
            <button class="child" onclick="numdisplay(3)">3</button>
            <button class="child" onclick="operators('x')">x</button>
            <button class="child" onclick="operators('+')">+</button>
        </div>
        <div class="calc-child">
            <button class="child" onclick="numdisplay(0)">0</button>
            <button class="child" onclick="decimal('.')">.</button>
            <button class="child" onclick="operators('⊼')">⊼</button>
            <button class="child"></button>
            <button class="child" onclick="equals()">=</button>
        </div>

    </div>
</body>
